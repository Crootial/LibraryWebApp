# Jenkins configuration as code: a local admin and the pipeline job, so there is nothing to click through.
jenkins:
  systemMessage: "Local Jenkins for testing the LibraryWebApp pipeline"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: >
      pipelineJob('librarywebapp') {
        description('Runs the Jenkinsfile from the repository mounted at /repo. Builds by itself when a new commit appears.')
        // Automatic trigger, set here so it is active before the first build. The Jenkinsfile repeats it.
        triggers {
          scm('* * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('/repo') }
                branches('*/${REPO_BRANCH:-main}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
