<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyGameVault</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    .game-item {
      display: flex;
      gap: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      align-items: flex-start;
      max-width: 600px;
      background-color: #f9f9f9;
    }
    .game-thumb {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #ddd;
    }
    .game-info {
      flex: 1;
    }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      cursor: pointer;
      padding: 5px 10px;
      border: 1px solid #999;
      border-radius: 4px;
      background-color: #fff;
    }
    .btn-delete {
      background-color: #ff4d4d;
      color: white;
      border: none;
    }
    .btn-delete:hover {
      background-color: #cc0000;
    }
    .edit-link {
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
    .edit-link:hover {
      text-decoration: underline;
    }
    details {
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 6px 10px;
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      color: #0066cc;
    }
  </style>
</head>

<body>
  <h1>MyGameVault</h1>

  <h3>Add a Game Manually</h3>
  <input id="title" placeholder="Title" />
  <input id="platform" placeholder="Platform (e.g. PC, PS5)" />
  <input id="rating" placeholder="Rating (e.g. 4.5)" />
  <button onclick="addGame()">Add Game</button>

  <h3>My Saved Games</h3>
  <ul id="games"></ul>

  <h3>Look Up Online</h3>
  <input id="search" placeholder="Game title to search..." />
  <button onclick="lookup()">Search Online</button>
  <ul id="results"></ul>

  <script>
    function getYear(released) {
      return released && released !== "N/A" ? released.split("-")[0] : "N/A";
    }

    // 1. FETCH & DISPLAY SAVED GAMES (WITH EDIT & DELETE)
    async function loadGames() {
      try {
        const res = await fetch("/api/games");
        const games = await res.json();
        let html = "";

        if (games.length === 0) {
          document.getElementById("games").innerHTML = "<li>No games saved yet.</li>";
          return;
        }

        for (let i = 0; i < games.length; i++) {
          const g = games[i];
          const imageSrc = g.image || "https://via.placeholder.com/100?text=No+Image";
          const platformsText = Array.isArray(g.platforms) && g.platforms.length > 0 
            ? g.platforms.join(", ") 
            : "N/A";
          const genresText = Array.isArray(g.genres) && g.genres.length > 0 
            ? g.genres.join(", ") 
            : "N/A";

          html += `
            <li class="game-item">
              <img src="${imageSrc}" class="game-thumb" alt="${g.title}" />
              <div class="game-info">
                <strong>${g.title}</strong> -  ${g.rating || "N/A"} (${getYear(g.released)})
                
                <div class="actions">
                  <!-- Edit link passing the game ID -->
                  <a class="edit-link" href="edit.html?id=${g.id}">Edit</a>
                  <!-- Delete button triggering backend delete -->
                  <button class="btn btn-delete" onclick="deleteGame('${g.id}')">Delete</button>
                </div>

                <details>
                  <summary>Show Details</summary>
                  <div class="details-content">
                    <p><strong>Release Date:</strong> ${g.released || "N/A"}</p>
                    <p><strong>Platforms:</strong> ${platformsText}</p>
                    <p><strong>Genres:</strong> ${genresText}</p>
                  </div>
                </details>
              </div>
            </li>
          `;
        }

        document.getElementById("games").innerHTML = html;
      } catch (err) {
        console.error("Error loading games:", err);
      }
    }

    // 2. ADD GAME MANUALLY
    async function addGame() {
      const title = document.getElementById("title").value;
      if (!title) return alert("Please enter a game title.");

      const game = {
        title: title,
        platforms: [document.getElementById("platform").value],
        rating: document.getElementById("rating").value,
      };

      await fetch("/api/games", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(game),
      });

      document.getElementById("title").value = "";
      document.getElementById("platform").value = "";
      document.getElementById("rating").value = "";

      loadGames();
    }

    // 3. DELETE GAME FUNCTION
    async function deleteGame(id) {
      if (!confirm("Are you sure you want to delete this game?")) return;

      try {
        const res = await fetch("/api/games/" + id, { method: "DELETE" });
        if (res.ok) {
          loadGames(); // Refresh the list after deleting
        } else {
          alert("Failed to delete game");
        }
      } catch (err) {
        console.error("Delete error:", err);
      }
    }

    // 4. SEARCH RAWG ONLINE
    async function lookup() {
      const title = document.getElementById("search").value;
      if (!title) return;

      const res = await fetch("/api/lookup?title=" + encodeURIComponent(title));
      const results = await res.json();
      let html = "";

      for (let i = 0; i < results.length; i++) {
        const r = results[i];
        const imageSrc = r.image || "https://via.placeholder.com/100?text=No+Image";
        const platformsText = Array.isArray(r.platforms) && r.platforms.length > 0 
          ? r.platforms.join(", ") 
          : "N/A";
        const genresText = Array.isArray(r.genres) && r.genres.length > 0 
          ? r.genres.join(", ") 
          : "N/A";

        const safeGameData = JSON.stringify(r).replace(/'/g, "&apos;");

        html += `
          <li class="game-item">
            <img src="${imageSrc}" class="game-thumb" alt="${r.title}" />
            <div class="game-info">
              <strong>${r.title}</strong> -  ${r.rating} (${getYear(r.released)})
              <br/>
              <button class="btn" onclick='saveFromLookup(${safeGameData})'>+ Save Game</button>

              <details>
                <summary>Show Details</summary>
                <div class="details-content">
                  <p><strong>Release Date:</strong> ${r.released}</p>
                  <p><strong>Platforms:</strong> ${platformsText}</p>
                  <p><strong>Genres:</strong> ${genresText}</p>
                </div>
              </details>
            </div>
          </li>
        `;
      }

      document.getElementById("results").innerHTML = html;
    }

    // SAVE GAME FROM LOOKUP
    async function saveFromLookup(gameData) {
      await fetch("/api/games", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(gameData),
      });

      loadGames();
    }

    // Load initial saved games list on page load
    loadGames();
  </script>
</body>
</html>
