<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <title>Edit book</title>
</head>
<body>
    <h1>Edit book</h1>
    <input id="title" placeholder="Title" /><br /><br />
    <input id="author" placeholder="Author" /><br /><br />
    <input id="year" placeholder="Year" /><br /><br />
    <button onclick="saveBook()">Save</button>
    <a href="index.html">Cancel</a>
 <script>
    // Read the id from the web address, for example edit.html?id=5
    const id = new URLSearchParams(location.search).get("id");
    // Load all books, find this one, and fill the boxes.
    async function loadBook() {
        const res = await fetch("/api/books");
        const books = await res.json();
        for (let i = 0; i < books.length; i++) {
            if (books[i].id == id) {
                document.getElementById("title").value = books[i].title;
                document.getElementById("author").value = books[i].author;
                document.getElementById("year").value = books[i].year;
            }
        }  
    }
 // Send the new values, then go back to the list.
 async function saveBook() {
    const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        year: document.getElementById("year").value,
    };
    await fetch("/api/books/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book),
    });
    window.location.href = "index.html";
 }
 loadBook();
 </script>
</body>
</html>
