<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14213d" />
  <title>Edit game · MyGameVault</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="platforms.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="edit">
  <header class="masthead">
    <div class="masthead-bar">
      <div class="wrap wrap-narrow">
        <div>
          <p class="kicker">Editing a game</p>
          <a class="brand" href="index.html" aria-label="MyGameVault, back to the home page"><span class="my">My</span><span class="name">GameVault</span></a>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabbar" aria-label="Sections">
    <div class="wrap wrap-narrow">
      <div class="tabs">
        <a class="tab" href="index.html#home">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#home" /></svg>
          <span>Home</span>
        </a>
        <a class="tab" href="index.html#collection">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#gamepad" /></svg>
          <span>My games</span>
        </a>
        <a class="tab" href="index.html#wishlist">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#heart" /></svg>
          <span>Wishlist</span>
        </a>
        <a class="tab" href="index.html#lookup">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#search" /></svg>
          <span>Look up online</span>
        </a>
        <a class="tab" href="index.html#add">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#plus" /></svg>
          <span>Add a game</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="shell shell-narrow">
    <a class="back" href="index.html#collection">&larr; Back to games</a>

    <section class="panel edit-card" aria-labelledby="edit-heading">
      <div class="panel-bar bar-amber">
        <p class="bar-title">Editing</p>
      </div>
      <div class="panel-body">
        <h1 id="edit-heading"><span id="edit-name">Edit game</span></h1>

        <form id="edit-form" novalidate hidden>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" placeholder="Title" autocomplete="off" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="developer">Developer</label>
              <input id="developer" name="developer" placeholder="Developer" autocomplete="off" />
            </div>
            <div class="field">
              <label for="publisher">Publisher</label>
              <input id="publisher" name="publisher" placeholder="Publisher" autocomplete="off" />
            </div>
          </div>
          <fieldset class="platform-picker">
            <legend>Platforms</legend>
            <div class="platform-frame"><div class="platform-grid"></div></div>
          </fieldset>
          <div class="field-row">
            <div class="field">
              <label for="rating">Rating (0-5)</label>
              <input id="rating" name="rating" placeholder="4.5" inputmode="decimal" autocomplete="off" />
            </div>
            <div class="field">
              <label for="year">Year</label>
              <input id="year" name="year" placeholder="Year" inputmode="numeric" autocomplete="off" />
            </div>
          </div>
          <p class="form-error" role="alert" hidden></p>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save changes</button>
            <a class="btn btn-ghost" href="index.html#collection">Cancel</a>
          </div>
        </form>

        <div id="edit-state" class="empty">
          <svg class="icon empty-mark" aria-hidden="true"><use href="icons.svg#gamepad" /></svg>
          <h3>Loading&hellip;</h3>
          <p>Fetching this game from your collection.</p>
          <div class="empty-actions" hidden></div>
        </div>
      </div>
    </section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
