<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Game</title>
</head>
<body>
  <h1>Edit Game</h1>
  
  <label for="title">Title:</label><br />
  <input id="title" placeholder="Title" /><br /><br />

  <label for="platform">Platforms (comma-separated):</label><br />
  <input id="platform" placeholder="e.g. PC, PS5, Xbox" /><br /><br />

  <label for="rating">Rating:</label><br />
  <input id="rating" placeholder="Rating (e.g. 4.5)" /><br /><br />

  <button onclick="saveGame()">Save</button>
  <a href="index.html">Cancel</a>

  <script>
    // 1. Read the game ID from URL query parameters (e.g., edit.html?id=1711420800000)
    const id = new URLSearchParams(location.search).get("id");

    // 2. Load all games, find the matching ID, and populate input fields
    async function loadGame() {
      if (!id) return;

      const res = await fetch("/api/games");
      const games = await res.json();

      for (let i = 0; i < games.length; i++) {
        if (games[i].id == id) {
          const g = games[i];
          document.getElementById("title").value = g.title || "";
          
          // Format array of platforms into a readable comma-separated string
          document.getElementById("platform").value = Array.isArray(g.platforms) 
            ? g.platforms.join(", ") 
            : (g.platforms || "");
            
          document.getElementById("rating").value = g.rating || "";
          break;
        }
      }  
    }

    // 3. Send updated values via PUT request and redirect back to index.html
    async function saveGame() {
      // Split input string into an array of platforms
      const platformInput = document.getElementById("platform").value;
      const platformsArray = platformInput
        ? platformInput.split(",").map(p => p.trim())
        : [];

      const updatedGame = {
        title: document.getElementById("title").value,
        platforms: platformsArray,
        rating: document.getElementById("rating").value,
      };

      await fetch("/api/games/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedGame),
      });

      window.location.href = "index.html";
    }

    loadGame();
  </script>
</body>
</html>
